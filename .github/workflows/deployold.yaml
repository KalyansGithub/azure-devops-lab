name: Build and Deploy to AKS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_CONTAINER_REGISTRY: "acrdevlabnj32xl" 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: '${{ secrets.AZURE_CREDENTIALS }}'

    - name: ACR Login
      run: |
        az acr login --name ${{ env.AZURE_CONTAINER_REGISTRY }}

    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/flask-app:${{ github.sha }} ./app
        docker tag ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/flask-app:${{ github.sha }} ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/flask-app:latest
        docker push ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/flask-app:${{ github.sha }}
        docker push ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/flask-app:latest

    - name: Get AKS Credentials
      run: |
        az aks get-credentials --resource-group rg-enterprise-lab-dev --name aks-dev-eastus-001 --overwrite-existing

    - name: Update Kubernetes Deployment Image
      run: |
        # Use an explicit temporary write or python/awk, or safely inject via standard environment substitution:
        IMAGE_NAME="${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/flask-app:${{ github.sha }}"
        
        # This replaces the image line cleanly regardless of what tag was there previously
        sed -i 's|image: .*/flask-app:.*|image: '"$IMAGE_NAME"'|g' k8s/deployment.yaml
        
        # Print the file to verify it updated correctly during the action run
        cat k8s/deployment.yaml  
        
    - name: Install Cert-Manager CRDs
      run: |
        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.3/cert-manager.yaml
        kubectl rollout status deployment/cert-manager -n cert-manager --timeout=120s || true
        kubectl rollout status deployment/cert-manager-webhook -n cert-manager --timeout=120s || true
        
    - name: Deploy to AKS
      run: |
        kubectl apply -f k8s/
        kubectl rollout status deployment/flask-app
