name: Build and Deploy to AKS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_CONTAINER_REGISTRY: "acrdevlabnj32xl" 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: '${{ secrets.AZURE_CREDENTIALS }}'

    - name: ACR Login
      run: |
        az acr login --name ${{ env.AZURE_CONTAINER_REGISTRY }}

    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/flask-app:${{ github.sha }} ./app
        docker tag ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/flask-app:${{ github.sha }} acrdevlabzbuw42.azurecr.io/flask-app:latest
        docker push ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/flask-app:${{ github.sha }}
        docker push ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/flask-app:latest

    - name: Get AKS Credentials
      run: |
        az aks get-credentials --resource-group rg-enterprise-lab-dev --name aks-dev-eastus-001 --overwrite-existing

    - name: Update Kubernetes Deployment Image
      run: |
        sed -i 's|${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/flask-app:latest|${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/flask-app:${{ github.sha }}|g' k8s/deployment.yaml

    - name: Deploy to AKS
      run: |
        kubectl apply -f k8s/
        kubectl rollout status deployment/flask-deployment